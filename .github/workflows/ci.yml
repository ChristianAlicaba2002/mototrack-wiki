name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment
      # notes the release. pnpm's exact version comes from "packageManager" in package.json.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Reports dependency/config issues without failing the build: some checks
      # query the network and can be flaky. Runs the lockfile-pinned devDependency.
      - name: Expo Doctor
        run: pnpm doctor
        continue-on-error: true

      # Bundles the JS for Android (no native build) to catch broken imports
      # and Metro resolution errors. Firebase values aren't needed to bundle.
      - name: Bundle Android
        run: pnpm exec expo export --platform android --output-dir dist
